aid: thndr
name: Thndr
description: >-
  Thndr is an Egyptian investment and brokerage mobile app that lets retail users open a
  regulated brokerage account and invest in Egyptian Exchange (EGX) stocks, US equities,
  mutual funds, ETFs, and IPOs from their phone. Founded in 2019 and headquartered in Cairo,
  Thndr is licensed by Egypt's Financial Regulatory Authority (FRA) and registered with the
  Egyptian Exchange as a brokerage, positioning itself as a low-cost, mobile-first gateway to
  the capital markets across Egypt and the wider MENA region. The company raised a $20M Series
  A in 2022 led by Tiger Global with participation from Prosus Ventures and others, and has been
  recognized among Forbes Middle East's top fintech companies. Thndr's product surface is a
  consumer investing app (iOS, Android, and a web account-access portal) with an educational
  Learn hub and a customer support center; as of this profile it publishes no public developer
  program, API documentation, or machine-readable API artifacts.
